name: Deploy Staging

on:
  push:
    branches:
      - stag

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Deploy Backend
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'EOF'
          cd /var/www/travhoo/backend-stag
          git pull origin stag
          source venv/bin/activate
          pip install -r requirements.txt
          pm2 restart fastapi-stag || pm2 start uvicorn main:app --name fastapi-stag --host 0.0.0.0 --port 8001
          EOF

      - name: Deploy Frontend
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'EOF'
          cd /var/www/travhoo/frontend-stag
          git pull origin stag
          npm install
          npm run build
          EOF
